[project]
name = "document-ocr-engine"
version = "0.1.0"
description = "Document scanner and OCR engine written from scratch in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "faker>=25.0",
    "wordfreq>=3.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.23",
    "scipy>=1.13",
    "rapidfuzz>=3.9",
    "cleval>=0.1.1",
    "Polygon3>=3.0.9",
    "shapely>=2.0",
    "numba>=0.60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docr"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
